name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Cancel superseded runs on the same branch / PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: this workflow only checks out, builds and tests.
permissions:
  contents: read

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  build-test:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Build and test take about a minute; fail a hung run fast instead of holding a runner for hours.
    timeout-minutes: 15
    strategy:
      # Run every leg to completion so a platform-specific failure is always visible.
      fail-fast: false
      matrix:
        # Windows too: the CLI is used from PowerShell and handles file paths and credentials files. macOS too: its
        # file system ignores case by default, and its credentials go to the Keychain.
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          # The projects target net10.0 (LTS).
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore DependencyInventory.sln

      - name: Build
        run: dotnet build DependencyInventory.sln -c Release --no-restore

      # The macOS Keychain tests run on a keychain created, unlocked and made the default for this run only.
      - name: Create an unlocked default keychain
        if: matrix.os == 'macos-latest'
        run: |
          security create-keychain -p ci depinv-ci.keychain
          security set-keychain-settings depinv-ci.keychain
          security unlock-keychain -p ci depinv-ci.keychain
          security list-keychains -d user -s depinv-ci.keychain
          security default-keychain -d user -s depinv-ci.keychain

      - name: Test
        env:
          DEPINV_TEST_KEYCHAIN: ${{ matrix.os == 'macos-latest' && '1' || '' }}
        run: dotnet test DependencyInventory.sln -c Release --no-build --logger "console;verbosity=normal"

      # The Secret Service round trip runs against a GNOME Keyring started and unlocked in a private D-Bus session.
      - name: Test the Secret Service store
        if: matrix.os == 'ubuntu-latest'
        env:
          DEPINV_TEST_SECRET_SERVICE: '1'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsecret-tools gnome-keyring dbus
          dbus-run-session -- bash -c 'echo -n ci | gnome-keyring-daemon --unlock --components=secrets > /dev/null &&
            dotnet test DependencyInventory.sln -c Release --no-build --filter "FullyQualifiedName~SecretService"'

      # The chart skill's generator is Python (standard library only); the runner's Python 3 runs its tests.
      - name: Test the framework-support-chart skill
        if: matrix.os == 'ubuntu-latest'
        run: python3 -m unittest discover -s .claude/skills/framework-support-chart/scripts -v

      # Rehearse the packaging on every run (one leg is enough: the package does not depend on the OS), so a
      # packing regression shows up here instead of on a release tag. Nothing is published.
      - name: Pack (smoke test, no publish)
        if: matrix.os == 'ubuntu-latest'
        run: dotnet pack src/DependencyInventory/DependencyInventory.csproj -c Release --no-build -p:Version=0.0.0-ci -o artifacts

